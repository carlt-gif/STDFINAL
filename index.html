<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Premiere: Carl & Emma</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700&family=DM+Sans:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold-light: #fff3d1;
            --gold: #c5a059;
            --gold-dark: #8c6d31;
            --bg: #070708;
            --card: #111113;
            --text: #f3f3f4;
            --text-muted: #8a8a93;
            --red: #ff453a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            letter-spacing: -0.01em;
        }

        .invitation-card {
            background-color: var(--card);
            border: 1px solid rgba(197, 160, 89, 0.2);
            padding: 50px 40px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.8), 0 0 50px rgba(197, 160, 89, 0.03);
            position: relative;
        }

        .studio-tag {
            font-size: 0.7rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 40px;
        }

        .title-group {
            margin-bottom: 40px;
        }

        h1 {
            font-family: 'Cinzel Decorative', serif;
            font-size: 3rem;
            font-weight: 900;
            letter-spacing: 2px;
            line-height: 1.1;
            background: linear-gradient(180deg, #ffffff 30%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .ampersand {
            font-family: 'Cinzel', serif;
            font-size: 1.3rem;
            color: var(--gold);
            margin: 10px 0;
            font-weight: 500;
            opacity: 0.8;
        }

        .event-tagline {
            font-size: 0.75rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 40px;
        }

        .production-details {
            margin-bottom: 45px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 25px 0;
        }

        .venue {
            font-size: 0.95rem;
            font-weight: 300;
            letter-spacing: 1px;
            color: #d1d1d6;
            margin-bottom: 8px;
        }

        .date {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--gold);
        }

        /* Modernized Timer Row */
        .timer-row {
            display: flex;
            justify-content: space-between;
            max-width: 320px;
            margin: 0 auto 50px auto;
        }

        .timer-segment {
            flex: 1;
            text-align: center;
        }

        .timer-val {
            font-family: 'Cinzel', serif;
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text);
            display: block;
            margin-bottom: 2px;
        }

        .timer-lbl {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            font-weight: 700;
        }

        /* Locked RSVP Bounds Sandbox */
        .rsvp-section {
            position: relative;
            background: rgba(255, 255, 255, 0.02);
            padding: 25px 20px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }

        .rsvp-headline {
            font-family: 'Cinzel', serif;
            font-size: 0.95rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 20px;
            color: var(--gold-light);
        }

        .action-box {
            position: relative;
            width: 100%;
            height: 60px;
        }

        .btn {
            font-family: 'DM Sans', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 14px 30px;
            border-radius: 4px;
            cursor: pointer;
            position: absolute;
            height: 46px;
            box-sizing: border-box;
            outline: none;
            border: none;
        }

        .btn-yes {
            background: var(--gold);
            color: #070708;
            left: 10%;
            top: 7px;
            z-index: 10;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .btn-yes:hover {
            background-color: var(--gold-light);
            transform: translateY(-1px);
        }

        .btn-no {
            background: transparent;
            color: var(--red);
            border: 1px solid rgba(255, 69, 58, 0.4);
            left: 55%;
            top: 7px;
            z-index: 20;
            white-space: nowrap;
            transition: left 0.12s cubic-bezier(0.2, 0.8, 0.2, 1), top 0.12s cubic-bezier(0.2, 0.8, 0.2, 1);
        }
    </style>
</head>
<body>

    <div class="invitation-card">
        <div class="studio-tag">A Lifetime Production Presenting A Love Story</div>
        
        <div class="title-group">
            <h1>CARL</h1>
            <div class="ampersand">and</div>
            <h1>EMMA</h1>
        </div>

        <div class="event-tagline">Are Locking In The Release Date</div>

        <div class="production-details">
            <div class="venue">Calvary Baptist Church — SJDM</div>
            <div class="date">DECEMBER 22, 2026</div>
        </div>

        <div class="timer-row">
            <div class="timer-segment">
                <span class="timer-val" id="days">00</span>
                <span class="timer-lbl">Days</span>
            </div>
            <div class="timer-segment">
                <span class="timer-val" id="hours">00</span>
                <span class="timer-lbl">Hrs</span>
            </div>
            <div class="timer-segment">
                <span class="timer-val" id="minutes">00</span>
                <span class="timer-lbl">Mins</span>
            </div>
            <div class="timer-segment">
                <span class="timer-val" id="seconds">00</span>
                <span class="timer-lbl">Secs</span>
            </div>
        </div>

        <div class="rsvp-section">
            <div class="rsvp-headline">Will you join us for the premiere?</div>
            <div class="action-box" id="actionBox">
                <button class="btn btn-yes" onclick="confirmAttendance()">YES!</button>
                <button class="btn btn-no" id="noButton">NO</button>
            </div>
        </div>
    </div>

    <script>
        // --- LIVE CLOCK ---
        const eventTimestamp = new Date("Dec 22, 2026 00:00:00").getTime();

        const updateClock = setInterval(function() {
            const timeNow = new Date().getTime();
            const delta = eventTimestamp - timeNow;

            if (delta < 0) {
                clearInterval(updateClock);
                return;
            }

            const d = Math.floor(delta / (1000 * 60 * 60 * 24));
            const h = Math.floor((delta % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((delta % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((delta % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = String(d).padStart(2, '0');
            document.getElementById("hours").innerText = String(h).padStart(2, '0');
            document.getElementById("minutes").innerText = String(m).padStart(2, '0');
            document.getElementById("seconds").innerText = String(s).padStart(2, '0');
        }, 1000);

        // --- SAFE BOUNDS RUNAWAY BUTTON ---
        const noButton = document.getElementById('noButton');
        const actionBox = document.getElementById('actionBox');

        function relocateNoButton() {
            const boundaryOffset = 6; 
            const maxX = actionBox.clientWidth - noButton.clientWidth - boundaryOffset;
            const maxY = actionBox.clientHeight - noButton.clientHeight - boundaryOffset;

            const randomX = Math.max(boundaryOffset, Math.floor(Math.random() * maxX));
            const randomY = Math.max(boundaryOffset, Math.floor(Math.random() * maxY));

            noButton.style.left = randomX + 'px';
            noButton.style.top = randomY + 'px';
        }

        noButton.addEventListener('mouseenter', relocateNoButton);
        noButton.addEventListener('touchstart', function(e) {
            e.preventDefault(); 
            relocateNoButton();
        });

        function confirmAttendance() {
            alert("🎟️ Ticket Booked! See you at the premiere! ❤️");
        }
    </script>
</body>
</html>
