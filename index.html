<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Premiere: Carl & Emma</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@500;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold-light: #fff3d1;
            --gold: #c5a059;
            --gold-dark: #8c6d31;
            --bg-dark: #0a0a0b;
            --card-bg: #121215;
            --text-light: #f5f5f7;
            --text-muted: #8e8e93;
            --red-accent: #ff453a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .premium-poster {
            background-color: var(--card-bg);
            border: 1px solid rgba(197, 160, 89, 0.3);
            padding: 60px 40px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            border-radius: 16px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.85);
            position: relative;
            overflow: hidden;
        }

        .studio-line {
            font-size: 0.7rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 400;
            margin-bottom: 45px;
        }

        .names-wrapper {
            margin-bottom: 45px;
        }

        h1 {
            font-family: 'Cinzel Decorative', serif;
            font-size: 3.2rem;
            font-weight: 900;
            letter-spacing: 3px;
            line-height: 1.1;
            background: linear-gradient(180deg, #ffffff 20%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .ampersand-divider {
            font-family: 'Cinzel', serif;
            font-size: 1.4rem;
            color: var(--gold-light);
            margin: 12px 0;
            font-weight: 500;
            letter-spacing: 2px;
        }

        .announcement-tag {
            font-size: 0.8rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 400;
            margin-bottom: 45px;
        }

        .event-details-block {
            margin-bottom: 50px;
            border-top: 1px solid rgba(197, 160, 89, 0.15);
            border-bottom: 1px solid rgba(197, 160, 89, 0.15);
            padding: 30px 0;
        }

        .location-text {
            font-size: 0.95rem;
            font-weight: 400;
            letter-spacing: 1px;
            color: #e5e5ea;
            margin-bottom: 12px;
        }

        .date-text {
            font-family: 'Cinzel', serif;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 3px;
            color: var(--gold);
        }

        .countdown-row {
            display: flex;
            justify-content: space-between;
            max-width: 340px;
            margin: 0 auto 50px auto;
        }

        .countdown-segment {
            flex: 1;
            text-align: center;
        }

        .countdown-number {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-light);
            display: block;
            margin-bottom: 4px;
        }

        .countdown-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .rsvp-card-section {
            background: rgba(255, 255, 255, 0.02);
            padding: 30px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .rsvp-header-text {
            font-family: 'Cinzel', serif;
            font-size: 0.95rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 25px;
            color: var(--gold-light);
        }

        .interactive-button-container {
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 24px;
            width: 100%;
            min-height: 50px;
            align-items: center;
        }

        .btn {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 14px 32px;
            border-radius: 4px;
            cursor: pointer;
            border: none;
            white-space: nowrap;
            transition: background-color 0.2s ease;
        }

        .btn-yes {
            background: linear-gradient(135deg, var(--gold-light), var(--gold));
            color: #0a0a0b;
        }

        .btn-no {
            background: transparent;
            color: var(--red-accent);
            border: 1px solid rgba(255, 69, 58, 0.3);
        }
    </style>
</head>
<body>

    <div class="premium-poster">
        <div class="studio-line">A Lifetime Production Presenting A Love Story</div>
        
        <div class="names-wrapper">
            <h1>CARL</h1>
            <div class="ampersand-divider">and</div>
            <h1>EMMA</h1>
        </div>

        <div class="announcement-tag">Are Locking In The Release Date</div>

        <div class="event-details-block">
            <div class="location-text">Calvary Baptist Church — SJDM</div>
            <div class="date-text">DECEMBER 22, 2026</div>
        </div>

        <div class="countdown-row">
            <div class="countdown-segment">
                <span class="countdown-number" id="days">00</span>
                <span class="countdown-label">Days</span>
            </div>
            <div class="countdown-segment">
                <span class="countdown-number" id="hours">00</span>
                <span class="countdown-label">Hrs</span>
            </div>
            <div class="countdown-segment">
                <span class="countdown-number" id="minutes">00</span>
                <span class="countdown-label">Mins</span>
            </div>
            <div class="countdown-segment">
                <span class="countdown-number" id="seconds">00</span>
                <span class="countdown-label">Secs</span>
            </div>
        </div>

        <div class="rsvp-card-section">
            <div class="rsvp-header-text">Will you join us for the premiere?</div>
            <div class="interactive-button-container" id="btnContainer">
                <button class="btn btn-yes" onclick="showCelebration()">YES!</button>
                <button class="btn btn-no" id="runawayNoBtn">NO</button>
            </div>
        </div>
    </div>

    <script>
        const targetEventDate = new Date("Dec 22, 2026 00:00:00").getTime();

        const countdownEngine = setInterval(function() {
            const currentMoment = new Date().getTime();
            const timeDifference = targetEventDate - currentMoment;

            if (timeDifference < 0) {
                clearInterval(countdownEngine);
                return;
            }

            const days = Math.floor(timeDifference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeDifference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeDifference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeDifference % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = String(days).padStart(2, '0');
            document.getElementById("hours").innerText = String(hours).padStart(2, '0');
            document.getElementById("minutes").innerText = String(minutes).padStart(2, '0');
            document.getElementById("seconds").innerText = String(seconds).padStart(2, '0');
        }, 1000);

        const runawayNoBtn = document.getElementById('runawayNoBtn');
        const btnContainer = document.getElementById('btnContainer');

        function alternateLayoutDirection() {
            if (btnContainer.style.flexDirection === 'row-reverse') {
                btnContainer.style.flexDirection = 'row';
            } else {
                btnContainer.style.flexDirection = 'row-reverse';
            }
        }

        runawayNoBtn.addEventListener('mouseenter', alternateLayoutDirection);
        runawayNoBtn.addEventListener('touchstart', function(event) {
            event.preventDefault(); 
            alternateLayoutDirection();
        });

        function showCelebration() {
            alert("🎟️ Ticket Booked! We look forward to seeing you at the premiere! ❤️");
        }
    </script>
</body>
</html>
